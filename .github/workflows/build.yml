name: Build desktop

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and release commit
        id: version
        env:
          RELEASE_BUILD: ${{ inputs.release }}
        run: |
          if [ "$RELEASE_BUILD" = true ]; then
            python3 scripts/version.py release
          else
            python3 scripts/version.py check
          fi
      - name: Format and verify resources
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all -- --check
          python3 scripts/check-assets.py
          git diff --exit-code

  desktop:
    needs: checks
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
          - os: windows-2025
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install Linux build and window dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          # The runner's Azure HTTP mirror can stall on large graphics packages.
          # Use Ubuntu's signed HTTPS archives for this step only.
          cat > "$RUNNER_TEMP/ta1278-ubuntu.list" <<'SOURCES'
          deb https://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb https://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb https://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          SOURCES
          apt=(sudo env DEBIAN_FRONTEND=noninteractive apt-get
            -o Dir::Etc::sourcelist="$RUNNER_TEMP/ta1278-ubuntu.list"
            -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
            -o Acquire::Retries=2 -o Acquire::https::Timeout=30)
          "${apt[@]}" update
          "${apt[@]}" install -y pkg-config libasound2-dev libxkbcommon-x11-0 libdbus-1-3 mesa-vulkan-drivers xvfb xauth
      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
            target/${{ matrix.target }}/debug
            target/${{ matrix.target }}/release
          key: desktop-v2-${{ matrix.platform }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/*.swift', 'crates/**/Cargo.toml', 'build/*.rs') }}
          restore-keys: |
            desktop-v2-${{ matrix.platform }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
            desktop-v2-${{ matrix.platform }}-${{ steps.rust.outputs.version }}-
      - name: Release tools on native OS
        run: python scripts/tests.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --target "${{ matrix.target }}" -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked --target "${{ matrix.target }}"
      - name: Headless library
        run: cargo check --locked -p phone-desktop --no-default-features --lib --target "${{ matrix.target }}"
      - name: Build optimized desktop
        run: cargo build --release --locked -p phone-desktop --target "${{ matrix.target }}"
      - name: Linux window presentation
        id: window
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/ta1278-xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s '-screen 0 1280x1024x24' timeout 60s \
            "target/${{ matrix.target }}/release/phone-desktop" \
            --data-dir "$RUNNER_TEMP/ta1278-profile" --disable sounds,music,video,network \
            --smoke-test "$RUNNER_TEMP/ta1278-frames"
      - name: Package native archive
        run: python scripts/package.py --target "${{ matrix.target }}" --no-build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ta1278-${{ matrix.platform }}
          path: |
            target/dist/TA1278-v${{ needs.checks.outputs.version }}-${{ matrix.platform }}.zip
            target/dist/TA1278-v${{ needs.checks.outputs.version }}-${{ matrix.platform }}.zip.sha256
            target/dist/TA1278-v${{ needs.checks.outputs.version }}-${{ matrix.platform }}.tar.gz
            target/dist/TA1278-v${{ needs.checks.outputs.version }}-${{ matrix.platform }}.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure() && runner.os == 'Linux' && steps.window.outcome == 'failure'
        with:
          name: window-diagnostics
          path: ${{ runner.temp }}/ta1278-frames
          if-no-files-found: ignore
          retention-days: 7
