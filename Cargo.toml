[workspace]
members = ["crates/phone-core", "crates/phone-desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "=0.8.9"

# Shipping build: keep font coverage while dropping debug information and
# optimizing across crate boundaries. Dev builds keep normal debug behavior.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
