[package]
name = "phone-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "phone_runtime"

[[bin]]
name = "phone-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
window = ["dep:winit", "dep:wgpu", "dep:pollster"]
android = ["window", "winit/android-native-activity", "dep:jni"]
desktop = ["window", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:rfd"]

[dependencies]
phone-core = { path = "../phone-core" }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav", "symphonia-pcm"] }
serde.workspace = true
serde_json.workspace = true
winit = { version = "0.30.13", optional = true }
# Native window backends; the embedded JS engine does not use WebGPU.
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }
pollster = { version = "0.4", optional = true }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "3"
url = "2"
# Parse DOM/selectors without the upstream CLI or unused error collection.
scraper = { version = "0.29", default-features = false }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
oxisynth = "=0.1.0"
midly = { version = "=0.5.3", default-features = false, features = ["std"] }

[build-dependencies]
miniz_oxide.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.5.3", optional = true }
objc2-app-kit = { optional = true, version = "=0.2.2", default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { optional = true, version = "=0.2.2", default-features = false, features = ["NSObject"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
rfd = { version = "=0.17.2", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
jni = { version = "=0.21.1", optional = true }
# This rquickjs release has no pregenerated Android bindings; generate them only for Android.
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "bindgen"] }
