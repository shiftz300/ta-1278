[package]
name = "phone-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
phone-core = { path = "../phone-core" }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav", "symphonia-pcm"] }
serde.workspace = true
serde_json.workspace = true
winit = "0.30.13"
wgpu = "30.0.1"
pollster = "0.4"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "3"
url = "2"
scraper = "0.29"
oxisynth = "=0.1.0"
midly = { version = "=0.5.3", default-features = false, features = ["std"] }

[build-dependencies]
miniz_oxide.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.5.3"
objc2-app-kit = { version = "=0.2.2", default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "=0.2.2", default-features = false, features = ["NSObject"] }
